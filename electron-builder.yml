appId: com.digambaran.app
productName: DIGAMBARAN
copyright: Copyright © Digambaran

directories:
  output: release

files:
  - dist/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: chrome-extension
    to: chrome-extension

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: DIGAMBARAN Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DIGAMBARAN
  runAfterFinish: true
