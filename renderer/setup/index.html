<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>DIGAMBARAN Setup</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="panel">
      <p class="brand">DIGAMBARAN</p>
      <h1>Digambaran is running.</h1>
      <p>
        Chrome download protection requires the Digambaran Chrome extension.
        Digambaran will not silently install it.
      </p>
      <ol>
        <li>Open <code>chrome://extensions</code></li>
        <li>Enable Developer mode</li>
        <li>Click Load unpacked</li>
        <li>Select the Digambaran <code>chrome-extension</code> folder</li>
      </ol>
      <div class="actions">
        <button id="install" class="primary">INSTALL / SET UP CHROME</button>
        <button id="folder">Open extension folder</button>
        <button id="close">Close</button>
      </div>
    </main>
    <script src="./renderer.js"></script>
  </body>
</html>
